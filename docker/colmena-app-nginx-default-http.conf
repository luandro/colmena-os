# ColmenaOS Nginx Default HTTP Configuration
# This file is mounted as the default nginx server configuration.
# It serves the same purpose as colmena.conf but is placed in the default location.
#
# Mounted to: /etc/nginx/http.d/default.conf
# This file should contain the same configuration as colmena.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Serve built frontend (React app) from nginx
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to Django backend (gunicorn) running inside the same container
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header Connection "";
        send_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # History API fallback for Single Page Applications (SPAs)
    # This allows client-side routing to work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }
}
