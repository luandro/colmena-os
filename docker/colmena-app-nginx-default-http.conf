# ColmenaOS Nginx Default HTTP Configuration (canonical)
# Copied into the image at /etc/nginx/http.d/default.conf so standalone runs
# behave identically to docker-compose deployments.
#
# Compose also mounts docker/colmena-app-nginx.conf; keep both files aligned.

# Map NGINX_CSP environment variable to a usable value
# If NGINX_CSP is not set, use a default CSP that allows the React app to function
map $env_NGINX_CSP $csp_value {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;";
    ~.+ $env_NGINX_CSP;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    # Content-Security-Policy: Configurable via NGINX_CSP environment variable
    add_header Content-Security-Policy $csp_value always;
    # Strict-Transport-Security: Enforce HTTPS (for production behind HTTPS proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Content-Type-Options: Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # X-Frame-Options: Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Referrer-Policy: Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions-Policy: Control browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Serve built frontend (React app) from nginx
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to Django backend (gunicorn) running inside the same container
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_set_header Connection "";
        send_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # History API fallback for Single Page Applications (SPAs)
    # This allows client-side routing to work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }
}
