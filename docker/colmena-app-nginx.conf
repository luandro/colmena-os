# ColmenaOS Nginx Configuration (compose override)
# Legacy mount retained for docker-compose so teams can inject extra nginx
# directives without rebuilding the image. The canonical default server lives in
# docker/colmena-app-nginx-default-http.conf.
#
# Mounted to: /etc/nginx/http.d/colmena.conf
# To customize: Copy the default server block from docker/colmena-app-nginx-default-http.conf
# into this file (or create additional server blocks) and restart the container.
