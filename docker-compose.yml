
services:
  # ----------------------------------------------------------------------------
  # DevOps Services (from colmena-devops submodule)
  # ----------------------------------------------------------------------------
  
  # Postgres (Database Service)
  postgres:
    image: postgres:13
    # Keep Postgres connections modest (200 for dev, <500 for prod) to avoid >10GB RAM usage.
    # Override via POSTGRES_MAX_CONNECTIONS when coupled with PgBouncer or similar pooling.
    command:
      - postgres
      - -c
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
    hostname: ${POSTGRES_HOSTNAME:-postgres}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colmena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-colmena}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      colmena_devops:
        aliases:
          - postgres
    restart: unless-stopped
    labels:
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colmena} -d ${POSTGRES_DB:-colmena}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@colmena.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      colmena_devops:
        aliases:
          - pgadmin
    restart: unless-stopped
    labels:
      io.balena.features.supervisor-api: '1'

  # Nextcloud Service
  nextcloud:
    image: colmena_nextcloud
    build:
      context: .
      dockerfile: docker/nextcloud-builder.Dockerfile
      args:
        BUILD_CONTEXT: colmena-devops/devops/apps/nextcloud/builder
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION:-28.0.3}
        NEXTCLOUD_API_WRAPPER_PORT: ${NEXTCLOUD_API_WRAPPER_PORT:-5001}
        APACHE_APP_PATH: ${APACHE_APP_PATH:-/var/www/nc_api_wrapper}
    # Removed privileged mode for security (Issue #6)
    # Add specific capabilities only if needed: cap_add: [CHOWN, SETUID, SETGID]
    networks:
      - colmena_devops
    volumes:
      - nextcloud_data:/var/www/html
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8003}:80"
      - "${NEXTCLOUD_API_HOST_PORT:-8004}:5001"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-colmena.local,localhost,*.local,192.168.*.*,10.*.*.*}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    restart: unless-stopped
    labels:
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
      io.balena.features.dbus: '1'

  # Mail Service (Mailcrab)
  mail:
    image: colmena_mail
    build:
      context: colmena-devops/devops/apps/mailcrab
      dockerfile: builder/Dockerfile
      args:
        - MAILCRAB_VERSION=latest
    ports:
      - "${MAILCRAB_UI_PORT:-1080}:1080"
      - "${MAILCRAB_SMTP_PORT:-1025}:1025"
    networks:
      colmena_devops:
        aliases:
          - mail
    restart: unless-stopped
    labels:
      io.balena.features.supervisor-api: '1'

  # ----------------------------------------------------------------------------
  # Colmena Unified App (Frontend + Backend in single container)
  # ----------------------------------------------------------------------------
  colmena-app:
    image: ${COLMENA_APP_IMAGE:-communityfirst/colmena-app:latest}
    x-casaos:
      store_app_id: colmena-os
      category: Media
      architectures:
        - amd64
        - arm64
      main: colmena-app
      title: ColmenaOS
      description: Offline-first community media platform
    env_file:
      - .env
    ports:
      # Port format: "HOST_PORT:CONTAINER_PORT"
      # HOST_PORT: Port on your machine (defaults match .env.example for local dev)
      # CONTAINER_PORT: Port inside the container (nginx=80, gunicorn=8000)
      - "${HTTP_PORT:-7180}:80"
      - "${BACKEND_PORT:-7100}:8000"
    environment:
      - STAGE=prod
      - DATABASE_URL=postgresql://${POSTGRES_USER:-colmena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-colmena}
      - SECRET_KEY=${SECRET_KEY}
      - COLMENA_SECRET_KEY=${COLMENA_SECRET_KEY:-insecure-ci-secret}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_HOSTS=localhost,127.0.0.1,*.local,*
      - CSRF_TRUSTED_ORIGINS=http://localhost:${HTTP_PORT:-7180}
      - "CORS_ALLOWED_ORIGINS=http://localhost:${HTTP_PORT:-7180},http://127.0.0.1:${HTTP_PORT:-7180},http://localhost:3000,http://127.0.0.1:3000"
      - POSTGRES_DATABASE=${POSTGRES_DB:-colmena}
      - POSTGRES_USERNAME=${POSTGRES_USER:-colmena}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOSTNAME=${POSTGRES_HOSTNAME:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - EMAIL_HOST=mail
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=false
      - NEXTCLOUD_URL=http://nextcloud
      - NEXTCLOUD_API_URL=${NEXTCLOUD_API_URL:-http://nextcloud}
      - NEXTCLOUD_API_WRAPPER_URL=http://nextcloud:5001
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - MEDIA_ROOT=/opt/app/media
      - STATIC_ROOT=/opt/app/static
      - BACKEND_HOSTNAME=colmena-app
      - FRONTEND_HOSTNAME=colmena-app
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@colmena.local}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - GUNICORN_WORKER_TIMEOUT=${GUNICORN_WORKER_TIMEOUT:-120}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - PORT=8000
    volumes:
      - media_data:/opt/app/media
      - static_data:/opt/app/static
      # Supervisor config: uses start-backend.sh for production (runs as colmena user)
      - ./docker/colmena-app-supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      # Legacy entrypoint: available for manual management commands
      - ./docker/colmena-app-entrypoint.sh:/opt/app/entrypoint.sh:ro
      # Nginx configurations
      - ./docker/colmena-app-nginx.conf:/etc/nginx/http.d/colmena.conf:ro
      - ./docker/colmena-app-nginx-default-http.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/colmena-app-nginx-disable.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - colmena_devops
    depends_on:
      postgres:
        condition: service_healthy
      mail:
        condition: service_started
      nextcloud:
        condition: service_started
    restart: unless-stopped
    labels:
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
      io.balena.features.dbus: '1'

# Create internal network for all services
networks:
  colmena_devops:
    driver: bridge

# Define named volumes for persistent data storage
volumes:
  pg_data:
  pgadmin_data:
  nextcloud_data:
  nextcloud_apps:
  static_data:
  media_data:
