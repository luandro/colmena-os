name: Nightly Published Image Validation

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: nightly-validation
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: communityfirst/colmena-app

jobs:
  test-latest-published:
    name: Validate Latest Published Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create .env from template
        run: cp .env.example .env

      - name: Run compose smoke test
        run: |
          echo "🧪 Running compose smoke test..."
          export ENV_EXPORT_PATH="$RUNNER_TEMP/compose-ports.env"
          TEARDOWN=0 PULL_IMAGES=1 ENV_EXPORT_PATH="$ENV_EXPORT_PATH" ./scripts/compose-smoke.sh
          if [[ -f "$ENV_EXPORT_PATH" ]]; then
            cat "$ENV_EXPORT_PATH" >> "$GITHUB_ENV"
          else
            echo "compose smoke test did not produce $ENV_EXPORT_PATH" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Setup Playwright
        working-directory: tests/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: npx playwright install --with-deps

      - name: Run full Playwright suite
        working-directory: tests/playwright
        run: |
          set -euo pipefail
          # Extract credentials and URLs from .env and compose output
          superadmin_email="$(grep '^SUPERADMIN_EMAIL=' ../../.env | cut -d= -f2- || echo 'admin@example.com')"
          superadmin_password="$(grep '^SUPERADMIN_PASSWORD=' ../../.env | cut -d= -f2- || echo 'CHANGE_ME')"
          playwright_base_url="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          playwright_api_base_url="${PLAYWRIGHT_API_BASE_URL:-http://localhost:5000}"

          # Pass directly to npm test via environment variables
          PLAYWRIGHT_SUPERADMIN_EMAIL="${superadmin_email}" \
          PLAYWRIGHT_SUPERADMIN_PASSWORD="${superadmin_password}" \
          PLAYWRIGHT_BASE_URL="${playwright_base_url}" \
          PLAYWRIGHT_API_BASE_URL="${playwright_api_base_url}" \
          npm run test

      - name: Upload compose smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-report
          path: smoke-report.md
          if-no-files-found: warn

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-artifacts
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          if-no-files-found: warn

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "📋 Collecting service logs..."
          echo "=== Colmena App Logs ==="
          docker compose -f docker-compose.yml --project-name colmena logs colmena-app --tail=200
          echo "=== PostgreSQL Logs ==="
          docker compose -f docker-compose.yml --project-name colmena logs postgres --tail=100
          echo "=== Nextcloud Logs ==="
          docker compose -f docker-compose.yml --project-name colmena logs nextcloud --tail=100
          echo "=== All Services Status ==="
          docker compose -f docker-compose.yml --project-name colmena ps

      - name: Teardown stack
        if: always()
        run: |
          echo "🧹 Cleaning up services..."
          docker compose -f docker-compose.yml --project-name colmena down -v
          docker system prune -f

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        timeout-minutes: 5
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-validation-failure',
              per_page: 1
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Nightly Validation Failed for Published Stack',
                body: `## Published Stack Validation Failure

            The nightly validation of the published Docker images failed.

            **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Date:** ${new Date().toISOString()}

            ### What This Means
            The published stack that users are pulling may be broken. This could indicate:
            - Docker Hub image corruption
            - Dependency changes in base images
            - Infrastructure compatibility issues
            - Service configuration problems

            ### Action Required
            1. **Investigate immediately** - Check the workflow logs
            2. **Verify image integrity** - Test locally with \`docker compose pull && docker compose up\`
            3. **Check dependencies** - Review if any upstream images changed
            4. **Consider rollback** - If issue persists, consider pointing to last known good SHA

            ### Testing Locally
            \`\`\`bash
            docker compose pull
            docker compose up -d
            ./scripts/compose-smoke.sh
            cd tests/playwright && npm run test
            \`\`\`

            This issue will auto-close when nightly validation passes.`,
                labels: ['bug', 'ci', 'priority-high', 'nightly-validation-failure']
              });
            } else {
              const issue = issues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ Nightly validation still failing as of ${new Date().toISOString()}

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }

      - name: Close issue on success
        if: success()
        uses: actions/github-script@v7
        timeout-minutes: 5
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-validation-failure',
              per_page: 10
            });

            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Nightly validation passed. Published stack is working correctly.

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Date:** ${new Date().toISOString()}

            Closing this issue.`
              });
            }

  nightly-summary:
    name: Nightly Validation Summary
    runs-on: ubuntu-latest
    needs: [test-latest-published]
    if: always()
    steps:
      - name: Generate summary
        run: |
          test_result="${{ needs.test-latest-published.result }}"

          echo "# 🌙 Nightly Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$test_result" = "success" ]; then
            echo "## ✅ PUBLISHED STACK HEALTHY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Image Pull | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "| Stack Startup | ✅ Running |" >> $GITHUB_STEP_SUMMARY
            echo "| Compose Smoke | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Playwright Full Suite | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Published stack is working correctly" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ PUBLISHED STACK ISSUES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Nightly validation failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Action Required:** Investigate failure and consider rollback" >> $GITHUB_STEP_SUMMARY
          fi
