name: Publish and Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: communityfirst/colmena-app

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image build summary
        run: |
          echo "# 🐳 Multi-Platform Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  validate-published:
    name: Validate Published Image
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code (no submodules needed)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create .env from template
        run: cp .env.example .env

      - name: Set image to test
        run: |
          echo "COLMENA_APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Pull published image
        run: |
          echo "📥 Pulling just-published image..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run compose smoke test
        run: |
          echo "🧪 Running compose smoke test on published image..."
          export ENV_EXPORT_PATH="$RUNNER_TEMP/compose-ports.env"
          TEARDOWN=0 ENV_EXPORT_PATH="$ENV_EXPORT_PATH" ./scripts/compose-smoke.sh
          if [[ -f "$ENV_EXPORT_PATH" ]]; then
            cat "$ENV_EXPORT_PATH" >> "$GITHUB_ENV"
          else
            echo "compose smoke test did not produce $ENV_EXPORT_PATH" >&2
            exit 1
          fi

      - name: Export environment for Playwright
        run: |
          set -euo pipefail
          superadmin_email="$(awk -F= '/^SUPERADMIN_EMAIL=/{val=$2} END {print val}' .env)"
          if [[ -z "${superadmin_email}" ]]; then
            # CI-ONLY TEST CREDENTIAL: Not a production secret
            # This default matches .env.example and is used only for CI smoke tests
            superadmin_email="admin@example.com"
          fi
          echo "SUPERADMIN_EMAIL=${superadmin_email}" >> "$GITHUB_ENV"
          superadmin_password="$(awk -F= '/^SUPERADMIN_PASSWORD=/{val=$2} END {print val}' .env)"
          if [[ -z "${superadmin_password}" ]]; then
            # CI-ONLY TEST CREDENTIAL: Not a production secret
            # This default matches .env.example and is used only for CI smoke tests
            superadmin_password="CHANGE_ME"
          fi
          echo "SUPERADMIN_PASSWORD=${superadmin_password}" >> "$GITHUB_ENV"

      - name: Setup Playwright
        working-directory: tests/playwright
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: npx playwright install --with-deps

      - name: Run Playwright smoke suite
        working-directory: tests/playwright
        run: npm run test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_API_BASE_URL: ${{ env.PLAYWRIGHT_API_BASE_URL }}
          PLAYWRIGHT_SUPERADMIN_EMAIL: ${{ env.SUPERADMIN_EMAIL }}
          PLAYWRIGHT_SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD || env.SUPERADMIN_PASSWORD }}

      - name: Upload compose smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-smoke-report
          path: smoke-report.md
          if-no-files-found: warn

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-playwright-artifacts
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          if-no-files-found: warn

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "📋 Collecting service logs..."
          echo "=== Colmena App Logs ==="
          docker compose -f docker-compose.yml --project-name colmena logs colmena-app --tail=200 || true
          echo "=== PostgreSQL Logs ==="
          docker compose -f docker-compose.yml --project-name colmena logs postgres --tail=100 || true
          echo "=== All Services Status ==="
          docker compose -f docker-compose.yml --project-name colmena ps || true

      - name: Teardown stack
        if: always()
        run: |
          echo "🧹 Cleaning up services..."
          docker compose -f docker-compose.yml --project-name colmena down -v
          docker system prune -f

  security-scan:
    name: Container Security Scan (Production)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout code (no submodules needed for scan)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install required tools
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run unified Trivy vulnerability scan
        id: trivy_scan
        run: |
          # Single Trivy scan with both JSON and SARIF outputs
          echo "🔍 Scanning published image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # Generate JSON output for vulnerability counting
          trivy image \
            --format json \
            --output trivy-output.json \
            --severity CRITICAL,HIGH \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Generate SARIF for GitHub Security tab
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Extract vulnerability counts
          critical_count=$(jq -r '.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL") | .VulnerabilityID' trivy-output.json 2>/dev/null | wc -l)
          high_count=$(jq -r '.Results[].Vulnerabilities[]? | select(.Severity == "HIGH") | .VulnerabilityID' trivy-output.json 2>/dev/null | wc -l)

          # Store for later steps
          echo "critical_count=$critical_count" >> $GITHUB_OUTPUT
          echo "high_count=$high_count" >> $GITHUB_OUTPUT

          echo "🔴 Critical vulnerabilities found: $critical_count"
          echo "🟠 High vulnerabilities found: $high_count"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security-scan-production'

      - name: Check for critical vulnerabilities (production gate)
        run: |
          critical_count="${{ steps.trivy_scan.outputs.critical_count }}"
          high_count="${{ steps.trivy_scan.outputs.high_count }}"

          # Fail if CRITICAL vulnerabilities exist (production blocker)
          if [ "$critical_count" -gt 0 ]; then
            echo "::error::Blocking production deployment - $critical_count CRITICAL vulnerabilities detected"
            exit 1
          fi

          # Warn if HIGH vulnerabilities exist (non-blocking)
          if [ "$high_count" -gt 0 ]; then
            echo "::warning::$high_count HIGH severity vulnerabilities detected - review recommended before production use"
          fi

      - name: Security scan summary
        if: always()
        run: |
          critical_count="${{ steps.trivy_scan.outputs.critical_count }}"
          high_count="${{ steps.trivy_scan.outputs.high_count }}"

          echo "# 🔒 Production Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Target:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Severity Filter:** CRITICAL, HIGH" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$critical_count" -eq 0 ] && [ "$high_count" -eq 0 ]; then
            echo "**Status:** ✅ No vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          elif [ "$critical_count" -eq 0 ]; then
            echo "**Status:** ⚠️ $high_count HIGH vulnerabilities detected (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ $critical_count CRITICAL vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gate Status:**" >> $GITHUB_STEP_SUMMARY
          if [ "$critical_count" -eq 0 ]; then
            echo "- ✅ CRITICAL gate: PASSED (0 found)" >> $GITHUB_STEP_SUMMARY
            echo "- ℹ️ HIGH vulnerabilities: $high_count (informational)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**✅ Safe for production deployment**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ CRITICAL gate: FAILED ($critical_count found)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**❌ DO NOT DEPLOY TO PRODUCTION**" >> $GITHUB_STEP_SUMMARY
          fi

  publish-summary:
    name: Publish & Validate Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-published, security-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          build_result="${{ needs.build-and-push.result }}"
          validate_result="${{ needs.validate-published.result }}"

          echo "# 🚀 Publish & Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$build_result" = "success" ] && [ "$validate_result" = "success" ]; then
            echo "## ✅ PUBLISHED IMAGE VALIDATED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Multi-platform Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Hub Push | ✅ Published |" >> $GITHUB_STEP_SUMMARY
            echo "| Published Image Test | ✅ Validated |" >> $GITHUB_STEP_SUMMARY
            echo "| Compose Smoke | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Playwright E2E | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Safe for production use**" >> $GITHUB_STEP_SUMMARY
          elif [ "$build_result" = "success" ] && [ "$validate_result" != "success" ]; then
            echo "## ⚠️ PUBLISHED BUT VALIDATION FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Image was built and pushed but validation tests failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **DO NOT USE - Published image has issues**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Investigate test failures and consider rollback" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Multi-platform build failed. Image was not published." >> $GITHUB_STEP_SUMMARY
          fi

          # Exit with failure if validation failed
          if [ "$validate_result" != "success" ]; then
            exit 1
          fi
