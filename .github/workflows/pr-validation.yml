name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'scripts/**'
      - 'colmena-devops/**'
      - 'tests/**'
      - 'Makefile'
      - 'balena.yml'
      - 'cloud-init*.yml'
      - 'supervisord.conf'
      - 'start-backend.sh'
      - 'backend'
      - 'backend/**'
      - 'frontend'
      - 'frontend/**'
      - '.env*'
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  COMPOSE_FILE: docker-compose.local.yml

jobs:
  test-local-build:
    name: Test Local Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Docker build cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker cache directory
        run: |
          mkdir -p /tmp/.buildx-cache
          rm -rf /tmp/.buildx-cache-new
          mkdir -p /tmp/.buildx-cache-new

      - name: Create .env from template
        run: cp .env.example .env

      - name: Build local unified image
        run: |
          echo "🔨 Building colmena-app from local source..."
          docker buildx bake -f "$COMPOSE_FILE" colmena-app \
            --load \
            --set '*.cache-from=type=local,src=/tmp/.buildx-cache' \
            --set '*.cache-to=type=local,dest=/tmp/.buildx-cache-new'
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run compose smoke test
        run: |
          echo "🧪 Running compose smoke test..."
          TEARDOWN=0 COMPOSE_FILE=$COMPOSE_FILE ./scripts/compose-smoke.sh

      - name: Export environment for Playwright
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BASE_URL=http://localhost:7180" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_API_BASE_URL=http://localhost:7100/api" >> "$GITHUB_ENV"
          superadmin_email="$(awk -F= '/^SUPERADMIN_EMAIL=/{val=$2} END {print val}' .env)"
          if [[ -z "${superadmin_email}" ]]; then
            # CI-ONLY TEST CREDENTIAL: Not a production secret
            # This default matches .env.example and is used only for CI smoke tests
            superadmin_email="admin@example.com"
          fi
          echo "SUPERADMIN_EMAIL=${superadmin_email}" >> "$GITHUB_ENV"
          superadmin_password="$(awk -F= '/^SUPERADMIN_PASSWORD=/{val=$2} END {print val}' .env)"
          if [[ -z "${superadmin_password}" ]]; then
            # CI-ONLY TEST CREDENTIAL: Not a production secret
            # This default matches .env.example and is used only for CI smoke tests
            superadmin_password="CHANGE_ME"
          fi
          echo "SUPERADMIN_PASSWORD=${superadmin_password}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Setup Playwright
        working-directory: tests/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: npx playwright install --with-deps

      - name: Run Playwright smoke suite
        working-directory: tests/playwright
        run: npm run test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_API_BASE_URL: ${{ env.PLAYWRIGHT_API_BASE_URL }}
          PLAYWRIGHT_SUPERADMIN_EMAIL: ${{ env.SUPERADMIN_EMAIL }}
          PLAYWRIGHT_SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD || env.SUPERADMIN_PASSWORD }}

      - name: Upload compose smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-build-smoke-report
          path: smoke-report.md
          if-no-files-found: warn

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-build-playwright-artifacts
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          if-no-files-found: warn

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "📋 Collecting service logs..."
          docker compose -f $COMPOSE_FILE logs --tail=100

      - name: Teardown stack
        if: always()
        run: |
          echo "🧹 Cleaning up services..."
          docker compose -f $COMPOSE_FILE down -v
          docker system prune -f

  pr-summary:
    name: PR Test Summary
    runs-on: ubuntu-latest
    needs: [test-local-build]
    if: always()
    steps:
      - name: Generate test summary
        run: |
          test_result="${{ needs.test-local-build.result }}"

          echo "# 🧪 PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$test_result" = "success" ]; then
            echo "## ✅ Local Build Tests PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test Stage | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Local Build | ✅ Built successfully |" >> $GITHUB_STEP_SUMMARY
            echo "| Compose Smoke | ✅ All endpoints responding |" >> $GITHUB_STEP_SUMMARY
            echo "| Playwright E2E | ✅ User flows working |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Stack:** docker-compose.local.yml (local build)" >> $GITHUB_STEP_SUMMARY
            echo "**Ready for merge** ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Local Build Tests FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Local build testing failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**NOT ready for merge** ❌" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
