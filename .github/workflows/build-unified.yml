name: Build and Push Unified ColmenaOS Image

on:
  repository_dispatch:
    types: [submodule-update]
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: colmena-app
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'communityfirst' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_suffix: ${{ steps.determine_tag.outputs.tag_suffix }}
      platforms: ${{ steps.determine_platforms.outputs.platforms }}
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag suffix
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag_suffix=-pr${{ github.event.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "tag_suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Determine platforms
        id: determine_platforms
        run: |
          if [ "${{ inputs.platforms }}" != "" ]; then
            echo "platforms=${{ inputs.platforms }}" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

  stack-tests:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      COLMENA_APP_IMAGE: colmena-app:test
      POSTGRES_PASSWORD: colmena_ci_postgres
      PGADMIN_DEFAULT_PASSWORD: colmena_ci_pgadmin
      SECRET_KEY: colmena_ci_super_secret_key_1234567890abcdef123456
      COLMENA_SECRET_KEY: colmena_ci_super_secret_key_1234567890abcdef123456
      NEXTCLOUD_ADMIN_PASSWORD: colmena_ci_nextcloud
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD: colmena_ci_superadmin
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_TRUSTED_DOMAINS: colmena.local,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build local unified image for tests
        run: docker build --pull --tag "$COLMENA_APP_IMAGE" .

      - name: Materialize .env for compose
        run: |
          cat > .env <<EOF
          POSTGRES_DB=colmena
          POSTGRES_USER=colmena
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          PGADMIN_DEFAULT_EMAIL=admin@example.com
          PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          COLMENA_SECRET_KEY=${COLMENA_SECRET_KEY:-$SECRET_KEY}
          DEBUG=0
          NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
          NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
          NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
          SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
          SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          HTTP_PORT=7180
          BACKEND_PORT=7100
          EOF

      - name: Run compose smoke test (keep stack up)
        run: ./scripts/compose-smoke.sh
        env:
          COMPOSE_FILE: docker-compose.yml
          PROJECT_NAME: ci-colmena
          TEARDOWN: "0"
          PULL_IMAGES: "0"
          ENV_EXPORT_PATH: smoke.env

      - name: Export smoke environment
        run: cat smoke.env >> $GITHUB_ENV

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: npx playwright install --with-deps

      - name: Run Playwright smoke suite
        working-directory: tests/playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_API_BASE_URL: ${{ env.PLAYWRIGHT_API_BASE_URL }}
          PLAYWRIGHT_SUPERADMIN_EMAIL: ${{ env.SUPERADMIN_EMAIL }}
          PLAYWRIGHT_SUPERADMIN_PASSWORD: ${{ env.SUPERADMIN_PASSWORD }}
        run: npm test

      - name: Upload compose smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-report
          path: smoke-report.md
          if-no-files-found: ignore

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore

      - name: Teardown stack
        if: always()
        run: docker compose -f docker-compose.yml --project-name ci-colmena down --volumes --remove-orphans

  build-unified:
    needs: [prepare, stack-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-unified
          key: ${{ runner.os }}-buildx-unified-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-unified-

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push unified Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest${{ needs.prepare.outputs.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ColmenaOS Unified
            org.opencontainers.image.description=ColmenaOS unified frontend + backend service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=local,src=/tmp/.buildx-cache-unified
          cache-to: type=local,dest=/tmp/.buildx-cache-unified-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-unified
          mv /tmp/.buildx-cache-unified-new /tmp/.buildx-cache-unified

  notify-completion:
    needs: [prepare, stack-tests, build-unified]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine build status
        id: status
        run: |
          unified_result="${{ needs.build-unified.result }}"
          tests_result="${{ needs.stack-tests.result }}"

          if [[ "$tests_result" == "success" && "$unified_result" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Compose smoke + Playwright tests passed and unified Docker image built successfully" >> $GITHUB_OUTPUT
          elif [[ "$tests_result" != "success" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Compose smoke or Playwright tests failed" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Unified Docker image build failed" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Balena deployment on success
        if: steps.status.outputs.status == 'success' && (github.ref == 'refs/heads/develop' || github.event_name == 'repository_dispatch')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-to-balena-draft
          client-payload: |
            {
              "services": ["unified"],
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "trigger": "${{ github.event_name }}"
            }

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.status.outputs.status }}";
            const message = "${{ steps.status.outputs.message }}";
            const testsResult = "${{ needs.stack-tests.result }}";
            const buildResult = "${{ needs.build-unified.result }}";

            const body = `## 🐳 Unified Docker Build Pipeline: ${status === 'success' ? '✅ SUCCESS' : '❌ FAILED'}

            ${message}

            | Stage | Status |
            | --- | --- |
            | Compose + Playwright Smoke | ${testsResult} |
            | Build & Push | ${buildResult} |

            **Platforms:** ${{ needs.prepare.outputs.platforms }}
            **Commit:** \`${{ github.sha }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });